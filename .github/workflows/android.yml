name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Check localization
        run: python3 scripts/check-strings.py
      - name: Test, lint and build
        run: ./gradlew :mix-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Upload installable development APK
        uses: actions/upload-artifact@v4
        with:
          name: Omni-DJ-development-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload release build
        uses: actions/upload-artifact@v4
        with:
          name: Omni-DJ-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            mix-core/build/reports/tests/
            app/build/reports/
